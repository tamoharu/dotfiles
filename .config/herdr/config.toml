onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
detach = "prefix+shift+q"
goto = "prefix+alt+g"
new_workspace = "prefix+shift+n"
next_workspace = "prefix+@"
previous_workspace = "prefix+backtick"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
previous_agent = "prefix+,"
next_agent = "prefix+."

[ui]
accent = "cyan"
sidebar_max_width = 20
sidebar_collapsed_mode = "hidden"
agent_panel_sort = "priority"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = false
reveal_hidden_cursor_for_cjk_ime = false
cjk_ime_agents = ["claude", "opencode"]
cjk_ime_cursor_shape = "block"

[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "~/.config/herdr/scripts/open-bottom-pane.sh yazi"
description = "Yazi"

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "~/.config/herdr/scripts/open-bottom-pane.sh hunk diff"
description = "Hunk"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "~/.config/herdr/scripts/open-bottom-pane.sh lazygit"
description = "Lazygit"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = '"$HERDR_BIN_PATH" pane split --pane "$HERDR_ACTIVE_PANE_ID" --direction down --ratio 0.7 --focus'
description = "Terminal"
