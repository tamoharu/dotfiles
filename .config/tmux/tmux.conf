# Prefix
set-option -g prefix C-j
unbind C-b
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Terminal and clipboard
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on
set -g allow-passthrough on
set -s escape-time 0
set -g history-limit 50000

# Windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4
bind '|' split-window -h -c "#{pane_current_path}"
bind '\\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
set -g mouse on

# Status
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g window-status-separator ""
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#80deea,bg=#333333,bold]#{?client_prefix,#[reverse],} Session: #S #[default]"
set -g status-right "#[fg=#565f89]%Y-%m-%d %H:%M#[default]"
setw -g window-status-format "#[fg=#cccccc,bg=#333333,bold] #I[#{pane_current_command}] #{b:pane_current_path} "
setw -g window-status-current-format "#[fg=#fafafa,bg=#0d47a1,bold] #I[#{pane_current_command}] #{b:pane_current_path} "

# TPM plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "arcticicestudio/nord-tmux"
set -g @continuum-restore "on"

if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run-shell ~/.tmux/plugins/tpm/tpm"
